name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Require the widget key variable
        env:
          WIDGET_KEY: ${{ vars.ALPHA_T_PUBLIC_KEY }}
        run: |
          if [ -z "$WIDGET_KEY" ]; then
            echo "::error::The repository variable ALPHA_T_PUBLIC_KEY is empty. Create it under Settings > Secrets and variables > Actions > Variables; refusing to deploy the placeholder."
            exit 1
          fi
      - name: Build dist/
        run: npm run build
        env:
          ALPHA_T_PUBLIC_KEY: ${{ vars.ALPHA_T_PUBLIC_KEY }}
      - name: Deploy to Cloudflare
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
